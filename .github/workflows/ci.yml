# PLATAFORMA-RUBIK-SEO-GEO — CI (CORE-9.0).
# No secrets, no deployment, no external services beyond installing dependencies from npm
# and the pinned public Core commit from GitHub. Next.js telemetry is disabled.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (lockfile, Core pinned to a commit)
        run: npm ci --no-fund --no-audit
      - name: Core pin
        run: npm run check:core-pin
      - name: Secrets guard
        run: npm run check:secrets
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke (local server, status endpoint)
        run: |
          npm start -- -p 3217 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3217/api/salud > salud.json && break; sleep 1; done
          cat salud.json
          node -e "const s=require('./salud.json');if(s.status!=='ok'||s.deployment!=='none'||!/^[0-9a-f]{40}$/.test(s.core.commit))process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3217/proyectos)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Cookie: rubik_demo_session=demo-analyst' http://localhost:3217/proyectos/otra-agencia/despacho-demo)" = "404"
